[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jirathip-dev/berth"
publish = false

[workspace.dependencies]
berth-proto = { path = "crates/berth-proto" }
berth-core = { path = "crates/berth-core" }
berth-server = { path = "crates/berth-server" }
clap = { version = "=4.6.7", features = ["derive"] }
pty-process = "=0.5.4"
rustix = { version = "=1.1.6", features = ["param", "process"] }
thiserror = "=2.0.21"
vte = { version = "=0.15.0", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
